[project]
name = "solr_terminal"
version = "0.1.0"
description = "Terminal version of the Solr Admin Query screen"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = ["textual", "httpx"]

[project.scripts]
solr_terminal = "solr_terminal.__main__:main"

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "respx"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/solr_terminal"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
